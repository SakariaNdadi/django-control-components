{% load dcc_tags %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ resource_label }}{% if panel.brand_label %} ·
        {{ panel.brand_label }}{% endif %}{% endblock %}</title>
    {% dcc_assets %}
    {% block head_extra %}{% endblock %}
</head>

<body class="dcc-body">
    <div class="dcc-panel" x-data="dccShell()" :class="{ 'is-nav-open': navOpen, 'is-railed': railed }">
        <button type="button" class="dcc-panel__navtoggle" aria-label="Toggle navigation" @click="navOpen = !navOpen">
            {% dcc_icon "bars" %}
        </button>
        <div class="dcc-panel__scrim" @click="navOpen = false" x-show="navOpen" x-transition.opacity></div>
        {% dcc_render sidebar %}
        <div class="dcc-panel__body">
            {% if topbar %}{% dcc_render topbar %}{% endif %}
            <main class="dcc-panel__main"{% if content_style %} style="{{ content_style }}"{% endif %}>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <div id="dcc-toasts" class="dcc-toasts" aria-live="polite"></div>
</body>

</html>
