<li class="dcc-nav__item">
  <a class="dcc-nav__link{% if active %} is-active{% endif %}" href="{{ url|default:'#' }}"
     {% if active %}aria-current="page"{% endif %}
     {% if external %}target="_blank" rel="noopener"{% endif %}>
    {% if dot %}<span class="dcc-nav__dot" style="background:{{ dot }}" aria-hidden="true"></span>{% endif %}
    {% if icon_html %}<span class="dcc-nav__icon" aria-hidden="true">{{ icon_html }}</span>{% endif %}
    <span class="dcc-nav__text">{{ label }}</span>
    {% if badge %}<span class="dcc-nav__badge">{{ badge }}</span>{% endif %}
  </a>
</li>
