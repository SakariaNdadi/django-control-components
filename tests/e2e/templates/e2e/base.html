{% load dcc_tags %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title|default:"e2e" }}</title>
  {% dcc_assets %}
</head>
<body class="dcc-body">
  <div class="dcc-panel" x-data="dccShell()" :class="{ 'is-nav-open': navOpen, 'is-railed': railed }">
    <button type="button" class="dcc-panel__navtoggle" aria-label="Toggle navigation" @click="navOpen = !navOpen">≡</button>
    <div class="dcc-panel__scrim" @click="navOpen = false" x-show="navOpen" x-transition.opacity></div>
    {{ sidebar }}
    <div class="dcc-panel__body">
      <main class="dcc-panel__main" id="e2e-main">{% block main %}{{ body }}{% endblock %}</main>
    </div>
  </div>
  <div id="dcc-toasts" class="dcc-toasts" aria-live="polite"></div>
</body>
</html>
